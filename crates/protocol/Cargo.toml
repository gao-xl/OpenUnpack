[package]
name = "openunpack-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zeroize = { version = "1", features = ["derive"] }
utoipa = { version = "=6.0.0", optional = true }

[features]
openapi = ["dep:utoipa"]
