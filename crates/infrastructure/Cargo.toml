[package]
name = "openunpack-infrastructure"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
openunpack-protocol = { path = "../protocol" }
openunpack-domain = { path = "../domain" }
openunpack-application = { path = "../application" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "process", "io-util", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
base64 = "0.22"
pbkdf2 = "0.12"
rand = "0.8"
walkdir = "2"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
flate2 = "1.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-core = "0.62.2"

[dev-dependencies]
tempfile = "3"
