[package]
name = "openunpack-local-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
openunpack-protocol = { path = "../protocol", features = ["openapi"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
utoipa = { version = "=6.0.0", features = ["axum_extras"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.29"

