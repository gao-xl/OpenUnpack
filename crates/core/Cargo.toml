[package]
name = "openunpack-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
openunpack-protocol = { path = "../protocol" }
openunpack-infrastructure = { path = "../infrastructure" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
regex = "1"
walkdir = "2"
encoding_rs = "0.8"
notify = "6.1.1"
tokio = { version = "1", features = ["rt-multi-thread","macros","time","sync","process","io-util","net"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation","Win32_Globalization","Win32_Security_Cryptography","Win32_Security_Authorization","Win32_System_Memory","Win32_System_SystemInformation", "Win32_System_JobObjects","Win32_System_Threading","Win32_System_Pipes","Win32_Storage_FileSystem","Win32_Security","Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus"] }
