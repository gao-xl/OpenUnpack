[workspace]
members = [
    "crates/protocol",
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/core",
    "crates/local-api",
    "crates/cli",
    "apps/desktop-host",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"
license = "MIT"

[profile.release]
# Keep the symbol table: panic reports are captured by the logging module, and a
# fully stripped binary turns every crash into an unresolvable address list.
strip = "debuginfo"
lto = "thin"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
