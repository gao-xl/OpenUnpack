[workspace]
members = [
    "crates/protocol",
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/core",
    "crates/local-api",
    "crates/cli",
    "apps/desktop-host",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[profile.release]
strip = true
lto = "thin"
