name: Windows verification and local release artifacts

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      offline_installer:
        description: Include Microsoft WebView2 offline installer (larger artifact)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: |
            apps/desktop-ui/package-lock.json
            apps/mcp-connector/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Pin Rust MSVC toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.96.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install cargo-audit
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit
      - name: Prepare self-contained Worker and UI
        run: ./scripts/prepare-desktop.ps1
      - name: Verify security audit policies with malformed and outdated inputs
        run: ./scripts/test-security-audit-policy.ps1
      - name: Lint frontend
        working-directory: apps/desktop-ui
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint:a11y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit production dependencies (npm)
        working-directory: apps/desktop-ui
        run: |
          # The advisory endpoint is a network service; retry transient timeouts.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm audit --omit=dev --audit-level=low
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "npm audit attempt $attempt failed; retrying in 15s"
            Start-Sleep -Seconds 15
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and audit local MCP connector
        working-directory: apps/mcp-connector
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm audit --audit-level=low
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "npm audit attempt $attempt failed; retrying in 15s"
            Start-Sleep -Seconds 15
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch locked Rust dependencies and collect notices/source
        run: |
          cargo fetch --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/collect-release-materials.ps1
      - name: Run automated security audits (cargo-audit & DotNetCliSAST)
        # Advisory exclusions require proof of absence in the current Windows dependency graph.
        # and .NET Roslyn Security Analyzers (CA21xx/CA30xx/CA53xx), outputting artifacts/verification/security-audit.json.
        run: ./scripts/audit-security.ps1 -InstallCargoAudit -DenyWarnings
      - name: Rust format and strict static checks
        run: |
          . ./scripts/common.ps1
          Import-OpenUnpackMsvc
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native and synthetic regression suites
        # The same source is checked before the real native pipeline starts.
        run: ./scripts/verify.ps1 -SkipPrepare -WorkerProtocol -SkipSecurityAudit
      - name: Build portable, source and NSIS installer artifacts
        run: |
          $offline = '${{ inputs.offline_installer }}' -eq 'true'
          ./scripts/build-desktop.ps1 -SkipPrepare -Installer -OfflineInstaller:$offline
      - name: Retain verification output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-verification
          path: |
            artifacts/verification/
            artifacts/worker-verification-*/results.json
          if-no-files-found: ignore
      - name: Retain release candidates (no external publishing)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenUnpack-windows-x64-release-candidates
          path: |
            artifacts/release/*.zip
            artifacts/release/*-setup.exe
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
