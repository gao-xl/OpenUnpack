name: 缺陷报告 (Bug Report)
description: 提交软件运行异常、解压错误或功能故障（请使用人工合成、已脱敏的测试样本）
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### ⚠️ 提交前安全须知
        请在提交前仔细阅读 [SECURITY.md](SECURITY.md)。
        **严禁上传**：真实密码明文、密码库导出文件（Vault）、备份口令、私有未授权文件内容或个人系统敏感路径。
        请务必使用**最小化的人工合成样本（Synthetic Sample）**进行问题复现。若涉及高危安全漏洞，请通过私密渠道上报。

  - type: checkboxes
    id: pre-check
    attributes:
      label: 前置排查确认
      description: 请确认您已完成以下准备工作
      options:
        - label: 我已在现有 Issue 中搜索，确认该问题未被重复报告
          required: true
        - label: 我使用的是官方发布的构建版本或基于最新源码编译的版本
          required: true
        - label: 我已确认本报告中的所有日志、路径和参数均已完成敏感信息脱敏
          required: true

  - type: dropdown
    id: environment-type
    attributes:
      label: 运行形态
      description: 请选择您使用的 OpenUnpack 交付形态
      options:
        - "便携版 (Portable)"
        - "标准安装版 (NSIS Installer)"
        - "含离线 WebView2 安装版 (Offline Installer)"
        - "本地源码调试构建 (cargo / dev-desktop.ps1)"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: 软件版本与 Windows 版本
      description: 例如 OpenUnpack 0.1.0 (commit abc1234) / Windows 11 23H2 (OS Build 22631.3007)
      placeholder: "版本号与系统详细版本"
    validations:
      required: true

  - type: input
    id: archive-info
    attributes:
      label: 目标归档格式与场景
      description: 涉及的格式类型、分卷形式、嵌套层数与存储介质类型
      placeholder: "例如：分卷 7z (.7z.001/.7z.002) 内部嵌套带密 RAR5；源盘为 HDD，目标盘为 NVMe SSD，已启用 SSD 工作缓存"
    validations:
      required: true

  - type: textarea
    id: reproduce-steps
    attributes:
      label: 详细复现步骤
      description: 清晰列出能够重现该问题的步骤序列
      placeholder: |
        1. 在“密码库”中录入测试密码 "test1234"
        2. 将人工合成的测试包 "test_sample.part1.rar" 拖入批量解压列表
        3. 勾选“启用 SSD 工作缓存”，输出目录设置为 "D:\ExtractTest"
        4. 点击“开始解压”
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: 预期行为与实际表现
      description: 描述您认为符合预期的行为，以及实际发生的反常现象（界面卡死、抛出错误代码、状态标记异常等）
      placeholder: |
        【预期表现】：正常展开内层归档，校验一致后原子发布至目标目录。
        【实际表现】：解压进行到 85% 时任务状态突变为“待核对”，任务日志提示临时目录锁定异常。
    validations:
      required: true

  - type: textarea
    id: sanitized-logs
    attributes:
      label: 脱敏错误日志与错误代码
      description: 粘贴相关的任务处理记录、控制台日志或终端输出（请务必隐藏用户名和私有目录）
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: 补充说明与环境上下文
      description: 任何其他有助于维护者排查的信息（如特定防病毒软件拦截、非标准系统字符集、挂载的虚拟驱动器等）
