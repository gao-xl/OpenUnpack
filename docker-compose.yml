services:
  openunpack:
    build:
      context: .
      dockerfile: Dockerfile
    image: openunpack/daemon:latest
    container_name: openunpack-daemon
    restart: unless-stopped
    ports:
      - "18420:18420"
    environment:
      - OPENUNPACK_DATA_DIR=/data
      - OPENUNPACK_ENGINE=native
      - OPENUNPACK_PORT=18420
      - OPENUNPACK_TRUSTED_ALL_PATHS=1
      # Optional: Explicit Master Key for portable AES-256-GCM vault
      # - OPENUNPACK_VAULT_KEY=your-secure-vault-master-key-here
      # Optional: Post-completion hook command or script
      # - OPENUNPACK_ON_COMPLETE=/scripts/notify.sh
    volumes:
      # Persistent configuration, database and vault
      - ./data:/data
      # Source download folder (e.g. connected with qBittorrent or Aria2)
      - ./downloads:/downloads
      # Extracted target output directory
      - ./extracted:/extracted
      # Automated watch directory
      - ./watch:/watch
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:18420/api/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
