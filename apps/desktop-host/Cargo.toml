[package]
name = "openunpack-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "openunpack_desktop"
crate-type = ["staticlib","cdylib","rlib"]

[dependencies]
openunpack-core = { path = "../../crates/core" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread","time","sync"] }
rfd = "0.15"
encoding_rs = "0.8"
zeroize = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation","Win32_System_DataExchange","Win32_System_Memory","Win32_UI_WindowsAndMessaging","Win32_System_Diagnostics_Debug"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
